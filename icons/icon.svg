<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5BFD" />
      <stop offset="100%" stop-color="#1F34A8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0E1854" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4" />

  <!-- Grid of 4 Operations -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Plus (top-left) -->
    <path d="M 160 115 L 160 205 M 115 160 L 205 160" stroke-width="26" />

    <!-- Minus (top-right) -->
    <path d="M 307 160 L 397 160" stroke-width="26" />

    <!-- Times (bottom-left) -->
    <path d="M 128 320 L 192 384 M 192 320 L 128 384" stroke-width="26" />

    <!-- Divide (bottom-right) -->
    <path d="M 307 352 L 397 352" stroke-width="26" />
    <circle cx="352" cy="308" r="14" stroke="none" fill="#FFFFFF" />
    <circle cx="352" cy="396" r="14" stroke="none" fill="#FFFFFF" />
  </g>
</svg>
